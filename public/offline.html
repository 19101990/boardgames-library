<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#070913">
    <title>You're offline — Board Game Shelf</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: system-ui, sans-serif;
        background: #070913;
        color: #fff;
      }

      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        padding: 24px;
        box-sizing: border-box;
      }

      main {
        width: min(100%, 360px);
        padding: 28px;
        border: 1px solid #1d2644;
        border-radius: 24px;
        background: #0f1426;
        text-align: center;
      }

      img {
        width: 72px;
        height: 72px;
      }

      h1 {
        margin: 18px 0 8px;
        font-size: 1.5rem;
      }

      p {
        color: #8ba2c4;
        line-height: 1.5;
      }

      a {
        display: inline-block;
        margin-top: 12px;
        padding: 12px 20px;
        border-radius: 12px;
        background: #38e1ff;
        color: #070913;
        text-decoration: none;
        font-weight: 700;
      }
    </style>
  </head>
  <body>
    <main>
      <img src="/icon-192.png" alt="">
      <h1>You're offline</h1>
      <p>This page is not available offline. Your saved library may still be available from the app home screen. Changes require an internet connection.</p>
      <a href="/">Open your library</a>
    </main>
  </body>
</html>
